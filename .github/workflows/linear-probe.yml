name: linear-probe
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue identifier to read history for (optional)
        required: false
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only Linear probe
        env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
          ISSUE: ${{ inputs.issue }}
        run: |
          gql() { jq -n --arg q "$1" --argjson v "${2:-null}" '{query:$q,variables:($v // {})}' | curl -sS https://api.linear.app/graphql -H "Authorization: $LINEAR_API_TOKEN" -H 'Content-Type: application/json' -d @-; echo; }
          gql '{organization{name urlKey} teams{nodes{key name states{nodes{name type}} labels{nodes{name}}}}}'
          if [ -n "$ISSUE" ]; then
            gql 'query($id:String!){issue(id:$id){identifier state{name} labels{nodes{name}} history(first:100){nodes{createdAt addedLabels{name} removedLabels{name} fromState{name} toState{name}}}}}' "$(jq -n --arg id "$ISSUE" '{id:$id}')"
          fi
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Token shape (no value)
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "length=${#T} prefix=${T:0:13}"
          printf '%s' "$T" | grep -q '[[:space:]]' && echo "contains whitespace" || echo "no whitespace"
          code=$(curl -s -o body.json -w '%{http_code}' https://api.anthropic.com/v1/messages \
            -H "Authorization: Bearer $(printf '%s' "$T" | tr -d '[:space:]')" -H 'anthropic-version: 2023-06-01' \
            -H 'anthropic-beta: oauth-2025-04-20' -H 'content-type: application/json' \
            -d '{"model":"claude-haiku-5-5","max_tokens":5,"messages":[{"role":"user","content":"hi"}]}')
          echo "direct call http=$code"; jq -c '{type, error: .error.message}' body.json
      - id: review
        uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: true
          prompt: Reply with the number of files in this repository's root folder.
          claude_args: >-
            --max-turns 5
            --allowedTools Read,Grep,Glob
            --json-schema '{"type":"object","properties":{"count":{"type":"integer"}},"required":["count"]}'
      - run: echo "$OUT"
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
