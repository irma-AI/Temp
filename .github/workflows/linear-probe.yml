name: linear-probe
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue identifier to read history for (optional)
        required: false
permissions: {}
jobs:
  setup:
    if: inputs.issue == 'setup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: States, label and three scratch issues in IRM
        env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
        run: |
          set -euo pipefail
          gql() { jq -n --arg q "$1" --argjson v "${2:-null}" '{query:$q,variables:($v // {})}' \
            | curl -sSf https://api.linear.app/graphql -H "Authorization: $LINEAR_API_TOKEN" -H 'Content-Type: application/json' -d @- \
            | tee /dev/stderr | jq -e 'if .errors then error(.errors|tostring) else . end'; }
          team=$(gql '{teams(filter:{key:{eq:"IRM"}}){nodes{id states{nodes{id name}}}}}')
          tid=$(jq -r '.data.teams.nodes[0].id' <<<"$team")
          state() { # name type color
            id=$(jq -r --arg n "$1" '.data.teams.nodes[0].states.nodes[] | select(.name==$n) | .id' <<<"$team")
            [ -n "$id" ] || id=$(gql 'mutation($i:WorkflowStateCreateInput!){workflowStateCreate(input:$i){workflowState{id}}}' \
              "$(jq -n --arg t "$tid" --arg n "$1" --arg ty "$2" --arg c "$3" '{i:{teamId:$t,name:$n,type:$ty,color:$c}}')" | jq -r '.data.workflowStateCreate.workflowState.id')
            echo "$id"; }
          ready=$(state Ready unstarted "#4ea7fc")
          state "Needs input" started "#f2c94c" >/dev/null
          lid=$(gql '{issueLabels(filter:{name:{eq:"ci-change"}}){nodes{id}}}' | jq -r '.data.issueLabels.nodes[0].id // empty')
          [ -n "$lid" ] || lid=$(gql 'mutation($i:IssueLabelCreateInput!){issueLabelCreate(input:$i){issueLabel{id}}}' \
            "$(jq -n '{i:{name:"ci-change",color:"#eb5757"}}')" | jq -r '.data.issueLabelCreate.issueLabel.id')
          create() { gql 'mutation($i:IssueCreateInput!){issueCreate(input:$i){issue{id identifier}}}' "$(jq -n --arg t "$tid" --arg ti "$1" --argjson l "$2" '{i:{teamId:$t,title:$ti,labelIds:$l}}')" | jq -r '.data.issueCreate.issue | "\(.id) \(.identifier)"'; }
          addlabel() { gql 'mutation($id:String!,$l:String!){issueAddLabel(id:$id,labelId:$l){success}}' "$(jq -n --arg id "$1" --arg l "$lid" '{id:$id,l:$l}')" >/dev/null; }
          toready() { gql 'mutation($id:String!,$s:String!){issueUpdate(id:$id,input:{stateId:$s}){success}}' "$(jq -n --arg id "$1" --arg s "$ready" '{id:$id,s:$s}')" >/dev/null; }
          read -r g1 g1k < <(create "Scratch: ci-change at creation, then Ready" "[\"$lid\"]"); sleep 2; toready "$g1"
          read -r g2 g2k < <(create "Scratch: ci-change added, then Ready" '[]'); sleep 2; addlabel "$g2"; sleep 2; toready "$g2"
          read -r b1 b1k < <(create "Scratch: Ready, then ci-change" '[]'); sleep 2; toready "$b1"; sleep 2; addlabel "$b1"
          for k in $g1k $g2k $b1k; do
            echo "== $k"
            gql 'query($id:String!){issue(id:$id){state{name} labels{nodes{name}} history(first:50){nodes{createdAt addedLabels{name} toState{name}}}}}' "$(jq -n --arg id "$k" '{id:$id}')" 2>/dev/null | jq -c '.data.issue'
          done
          echo "RESULT good-at-creation=$g1k good-added=$g2k bad-after-ready=$b1k"
  read:
    if: inputs.issue != '' && inputs.issue != 'setup' && inputs.issue != 'reorder' && inputs.issue != 'archive' && inputs.issue != 'image'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
          ISSUES: ${{ inputs.issue }}
        run: |
          q() { jq -n --arg q "$1" --arg id "$2" '{query:$q,variables:{id:$id}}' | curl -sS https://api.linear.app/graphql -H "Authorization: $LINEAR_API_TOKEN" -H 'Content-Type: application/json' -d @- | jq -c .; }
          q '{viewer{name admin} organization{name}}' x
          for k in ${ISSUES//,/ }; do
            echo "== $k"
            uuid=$(q 'query($id:String!){issue(id:$id){id createdAt updatedAt}}' "$k" | tee /dev/stderr | jq -r .data.issue.id)
            q 'query($id:String!){issue(id:$id){history{nodes{id createdAt actor{name} botActor{name} addedLabelIds toStateId}}}}' "$uuid"
            q 'query($id:String!){issue(id:$id){history(last:50,includeArchived:true){nodes{id createdAt}}}}' "$uuid"
          done
  reorder:
    if: inputs.issue == 'reorder'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
        run: |
          set -euo pipefail
          gql() { jq -n --arg q "$1" --argjson v "${2:-null}" '{query:$q,variables:($v // {})}' \
            | curl -sSf https://api.linear.app/graphql -H "Authorization: $LINEAR_API_TOKEN" -H 'Content-Type: application/json' -d @- \
            | jq -e 'if .errors then error(.errors|tostring) else . end'; }
          t=$(gql '{teams(filter:{key:{eq:"IRM"}}){nodes{states{nodes{id name}}}} issueLabels(filter:{name:{eq:"ci-change"}}){nodes{id}}}')
          sid() { jq -r --arg n "$1" '.data.teams.nodes[0].states.nodes[]|select(.name==$n)|.id' <<<"$t"; }
          todo=$(sid Todo); ready=$(sid Ready); lid=$(jq -r '.data.issueLabels.nodes[0].id' <<<"$t")
          st() { gql 'mutation($id:String!,$s:String!){issueUpdate(id:$id,input:{stateId:$s}){success}}' "$(jq -n --arg id "$1" --arg s "$2" '{id:$id,s:$s}')" >/dev/null; echo "$(date -u +%T) $1 -> state $3"; }
          lab() { gql "mutation(\$id:String!,\$l:String!){issue$2Label(id:\$id,labelId:\$l){success}}" "$(jq -n --arg id "$1" --arg l "$lid" '{id:$id,l:$l}')" >/dev/null; echo "$(date -u +%T) $1 label $2"; }
          # reset both to Todo without the label
          for k in IRM-2 IRM-3; do lab $k Remove; st $k "$todo" Todo; done
          sleep 20
          lab IRM-2 Add; sleep 20; st IRM-2 "$ready" Ready
          sleep 20
          st IRM-3 "$ready" Ready; sleep 20; lab IRM-3 Add
          sleep 20
          for k in IRM-2 IRM-3; do echo "== $k"; gql 'query($id:String!){issue(id:$id){history(first:50){nodes{createdAt addedLabels{name} removedLabels{name} fromState{name} toState{name}}}}}' "$(jq -n --arg id "$k" '{id:$id}')" | jq -c '.data.issue.history.nodes'; done
  archive:
    if: inputs.issue == 'archive'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
        run: |
          for k in IRM-1 IRM-2 IRM-3; do
            jq -n --arg id "$k" '{query:"mutation($id:String!){issueArchive(id:$id){success}}",variables:{id:$id}}' \
              | curl -sS https://api.linear.app/graphql -H "Authorization: $LINEAR_API_TOKEN" -H 'Content-Type: application/json' -d @- | jq -c --arg k "$k" '{($k): .}'
          done
  image:
    if: inputs.issue == 'image'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push probe images
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          img=ghcr.io/irma-ai/temp
          for v in a b broken; do
            broken=0; [ "$v" = broken ] && broken=1
            docker build -q -t "$img:probe-$v" --build-arg PROBE_VERSION="probe-$v" --build-arg PROBE_BROKEN=$broken probe
            docker push -q "$img:probe-$v"
            echo "digest_$v=$(docker inspect --format '{{index .RepoDigests 0}}' "$img:probe-$v" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/irma-ai/temp
          subject-digest: ${{ steps.build.outputs.digest_a }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/irma-ai/temp
          subject-digest: ${{ steps.build.outputs.digest_b }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/irma-ai/temp
          subject-digest: ${{ steps.build.outputs.digest_broken }}
          push-to-registry: true
      - name: Verify one attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://ghcr.io/irma-ai/temp:probe-a" --repo "$GITHUB_REPOSITORY"
